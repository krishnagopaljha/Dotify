<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliasForge | Gmail Dot Trick Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="brand-header">
            <div class="brand-copy">
                <p class="eyebrow">Gmail alias generator</p>
                <h1>Dotify</h1>
            </div>
        </header>

        <main class="generator-card">
            <p class="subtitle">Create every valid Gmail dot-address variation from a single username.</p>

            <label for="emailInput">Gmail username</label>
            <div class="input-group">
                <input type="text" id="emailInput" maxlength="30" placeholder="yourname" aria-label="Gmail username">
                <span class="domain">@gmail.com</span>
            </div>

            <div class="actions">
                <button id="generateBtn" type="button">Generate</button>
                <button id="copyBtn" class="secondary" type="button">Copy all</button>
            </div>

            <div class="status-row">
                <span class="stat-pill"><strong id="variationCount">0</strong> variations</span>
            </div>

            <div id="result" class="result-list" aria-live="polite"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
